<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Посещаемость группы</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 15px; background-color: #f7f9fa; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #111; font-size: 1.8em; margin-bottom: 25px; }
        .stats { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .stat-card { flex: 1; min-width: 130px; background: #fff; padding: 20px 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .stat-value { font-size: 2.2em; font-weight: bold; color: #0056b3; }
        .stat-label { font-size: 0.9em; color: #666; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .chart-container { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .chart { width: 100%; height: 350px; }
        .footer { text-align: center; font-size: 0.85em; color: #888; padding-bottom: 20px; }
        #error-message { display: none; color: #d32f2f; text-align: center; background: #ffebee; padding: 20px; border-radius: 8px; border: 1px solid #ffcdd2; margin-bottom: 20px; }
        @media (max-width: 600px) { .chart { height: 300px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Дашборд посещаемости</h1>
        <div id="error-message">Не удалось загрузить данные. Убедитесь, что файл <b>attendance.csv</b> загружен в репозиторий рядом со страницей.</div>
        
        <div class="stats" id="stats-container" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="val-avg">0%</div>
                <div class="stat-label">Средняя явка</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="val-students">0</div>
                <div class="stat-label">Студентов</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="val-classes">0</div>
                <div class="stat-label">Занятий</div>
            </div>
        </div>

        <div class="chart-container" id="chart1-container" style="display: none;">
            <div id="chart-line" class="chart"></div>
        </div>

        <div class="chart-container" id="chart2-container" style="display: none;">
            <div id="chart-bar" class="chart"></div>
        </div>

        <div class="footer">
            Данные получены из реального списка группы и полностью обезличены.
        </div>
    </div>

    <script>
        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            if (lines.length === 0) return [];
            const sep = lines[0].includes(';') ? ';' : ',';
            return lines.map(line => {
                let row = [], inQuotes = false, val = '';
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === sep && !inQuotes) { row.push(val); val = ''; } 
                    else val += char;
                }
                row.push(val);
                return row;
            });
        }

        fetch('attendance.csv')
            .then(response => {
                if (!response.ok) throw new Error('File not found');
                return response.arrayBuffer();
            })
            .then(buffer => {
                let decoder = new TextDecoder('utf-8');
                let text = decoder.decode(buffer);
                if (text.includes('')) {
                    decoder = new TextDecoder('windows-1251');
                    text = decoder.decode(buffer);
                }
                processData(parseCSV(text));
            })
            .catch(error => {
                document.getElementById('error-message').style.display = 'block';
                console.error('Ошибка загрузки CSV:', error);
            });

        function processData(data) {
            if (data.length < 2) return;
            
            document.getElementById('stats-container').style.display = 'flex';
            document.getElementById('chart1-container').style.display = 'block';
            document.getElementById('chart2-container').style.display = 'block';

            const headers = data[0].slice(1);
            const rows = data.slice(1);
            const numStudents = rows.length;
            const numClasses = headers.length;
            
            let totalPresence = 0;
            let totalPossibleAll = 0;
            let classPresence = new Array(numClasses).fill(0);
            let classPossible = new Array(numClasses).fill(0);
            let studentPresencePercentages = [];

            rows.forEach(row => {
                let studentTotal = 0;
                let studentPossible = 0;
                for (let i = 1; i <= numClasses; i++) {
                    const val = row[i] ? row[i].trim() : '';
                    // Поддержка форматов 1, 1.0, 0, 0.0
                    if (val === '1' || val === '1.0' || val === '0' || val === '0.0') {
                        studentPossible++;
                        classPossible[i - 1]++;
                        totalPossibleAll++;
                        if (val === '1' || val === '1.0') {
                            studentTotal++;
                            classPresence[i - 1]++;
                            totalPresence++;
                        }
                    }
                }
                if (studentPossible > 0) {
                    studentPresencePercentages.push((studentTotal / studentPossible) * 100);
                }
            });

            const avgAttendance = ((totalPresence / totalPossibleAll) * 100).toFixed(1);
            
            document.getElementById('val-avg').innerText = avgAttendance + '%';
            document.getElementById('val-students').innerText = numStudents;
            document.getElementById('val-classes').innerText = numClasses;

            // Расчет явки по каждому занятию только для тех, кто был в списке
            const classAttendancePercent = classPresence.map((p, i) => {
                return classPossible[i] > 0 ? ((p / classPossible[i]) * 100).toFixed(1) : 0;
            });

            const lineChart = echarts.init(document.getElementById('chart-line'));
            lineChart.setOption({
                title: { text: 'Явка по занятиям в %', left: 'center', textStyle: { fontSize: 14 } },
                tooltip: { trigger: 'axis', formatter: '{b}: <b>{c}%</b>' },
                grid: { left: '10%', right: '5%', bottom: '15%' },
                xAxis: { type: 'category', data: headers, axisLabel: { rotate: 45 } },
                yAxis: { type: 'value', max: 100 },
                series: [{
                    data: classAttendancePercent,
                    type: 'line',
                    smooth: true,
                    symbolSize: 8,
                    markLine: {
                        data: [{ yAxis: avgAttendance, name: 'Среднее' }],
                        label: { formatter: '{c}%', position: 'insideStartTop' },
                        lineStyle: { type: 'dashed', color: '#ff4d4f' }
                    },
                    itemStyle: { color: '#0056b3' },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: 'rgba(0,86,179,0.3)'}, {offset: 1, color: 'rgba(0,86,179,0.0)'}]) }
                }]
            });

            let bins = [0, 0, 0, 0];
            studentPresencePercentages.forEach(p => {
                if (p < 25) bins[0]++;
                else if (p < 50) bins[1]++;
                else if (p < 75) bins[2]++;
                else bins[3]++;
            });

            const barChart = echarts.init(document.getElementById('chart-bar'));
            barChart.setOption({
                title: { text: 'Распределение студентов по доле посещений', left: 'center', textStyle: { fontSize: 14 } },
                tooltip: { trigger: 'axis', formatter: '{b}: <b>{c} чел.</b>' },
                grid: { left: '10%', right: '5%', bottom: '15%' },
                xAxis: { type: 'category', data: ['< 25%', '25 - 50%', '50 - 75%', '≥ 75%'] },
                yAxis: { type: 'value', minInterval: 1 },
                series: [{
                    data: bins,
                    type: 'bar',
                    barWidth: '50%',
                    itemStyle: { color: '#28a745', borderRadius: [4, 4, 0, 0] },
                    label: { show: true, position: 'top' }
                }]
            });

            window.addEventListener('resize', () => { lineChart.resize(); barChart.resize(); });
        }
    </script>
</body>
</html>
